<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>交通空白マップ — 公共交通でどこまで行けるか</title>
<style>
  :root { --bg:#070a10; --fg:#e8eef6; --muted:#9fb0c4; --panel:rgba(14,19,28,.86); --line:#223047; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; touch-action:none; cursor:crosshair; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:fixed; left:12px; right:12px; top:12px; display:flex; flex-wrap:wrap; gap:14px 20px;
    align-items:center; padding:10px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; backdrop-filter:blur(6px); max-width:calc(100vw - 24px); box-sizing:border-box; }
  #bar b { color:#fff; } .grp { display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .grp label { color:var(--muted); font-size:.82rem; }
  input[type=range] { width:150px; accent-color:#2fd3b0; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:4px 10px; cursor:pointer; font-size:.82rem; }
  .seg button.on { background:#2fd3b0; color:#062018; font-weight:700; }
  #val { color:#7ef0d4; font-variant-numeric:tabular-nums; }
  #hint { position:fixed; left:12px; bottom:12px; color:var(--muted); font-size:.78rem;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 10px; max-width:calc(100vw - 24px); box-sizing:border-box; }
  #tip { position:fixed; pointer-events:none; display:none; background:rgba(8,12,18,.95);
    border:1px solid var(--line); border-radius:7px; padding:4px 8px; font-size:.8rem; color:#fff; z-index:5; }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="bar">
  <div class="grp"><b>交通空白マップ</b>
    <select id="region" style="background:#0d1420;color:#e8eef6;border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:.85rem">
      <option value="reach_toyama.txt">富山（富山地鉄バス）</option>
      <option value="reach_toei.txt">東京・都営バス（23区）</option>
    </select></div>
  <div class="grp"><label>出発時刻</label><input id="time" type="range" min="300" max="1439" step="5" value="480"><span id="val">08:00</span></div>
  <div class="grp"><label>曜日</label><span class="seg"><button id="wd" class="on">平日</button><button id="hd">土休</button></span></div>
  <div class="grp"><label>到達<span id="hzv">90</span>分</label><input id="hz" type="range" min="15" max="120" step="5" value="90"></div>
  <div class="grp"><label>乗換<span id="mxv">3</span>分</label><input id="mx" type="range" min="0" max="15" step="1" value="3"></div>
  <div class="grp"><span id="reached" style="color:var(--muted)">—</span></div>
</div>
<div id="hint">地図を<b>クリック</b>すると、そこを出発地にして到達圏を塗り直します。ドラッグで移動・ホイール/ピンチで拡大。暗い所＝その時刻に公共交通で行けない（交通空白）。</div>
<div id="tip"></div>
<div id="msg">読み込み中…</div>
<script src="rm.js"></script>
<script>
let M, cv, ctx, img, W=0, H=0, dpr=1;
const $ = id => document.getElementById(id);
function pass(s){ const n=M.lengthBytesUTF8(s)+1, p=M._malloc(n); M.stringToUTF8(s,p,n); return p; }
const hhmm = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

function size(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  W=cv.width; H=cv.height;
  M._rm_resize(W,H,dpr);
  img = ctx.createImageData(W,H);
}
function draw(){
  const ptr = M._rm_render();
  img.data.set(M.HEAPU8.subarray(ptr, ptr+W*H*4));
  ctx.putImageData(img,0,0);
  const j = JSON.parse(M.UTF8ToString(M._rm_info()));
  $('reached').textContent = `${Math.floor(j.horizon/60)}分以内 ${j.reached} / ${j.total} 停留所`;
}

(async () => {
  const [data, base, font, mod] = await Promise.all([
    fetch('reach_toyama.txt').then(r=>r.text()),
    fetch('basemap.txt').then(r=>r.text()),
    fetch('font.ttf').then(r=>r.arrayBuffer()),
    createRM()]);
  M = mod; cv = $('cv'); ctx = cv.getContext('2d');
  const dp = pass(data), bp = pass(base);
  const fb = new Uint8Array(font), fp = M._malloc(fb.length); M.HEAPU8.set(fb, fp);
  const nstops = M._rm_init(dp, bp, fp, fb.length);
  M._free(dp); M._free(bp); M._free(fp);
  if (!nstops){ $('msg').textContent='データの読み込みに失敗しました'; return; }
  $('msg').remove();
  size(); M._rm_fit(); draw();
  window.addEventListener('resize', ()=>{ size(); draw(); });

  // 地域切り替え（GTFS データだけ入れ替え。東京は大きいので少し待つ）
  $('region').addEventListener('change', async e => {
    const prev = $('reached').textContent; $('reached').textContent = '読み込み中…';
    try {
      const t = await fetch(e.target.value).then(r=>r.text());
      const p = pass(t); const ns = M._rm_load(p); M._free(p);
      if (!ns){ $('reached').textContent = '読み込み失敗'; return; }
      M._rm_fit(); draw();
    } catch(err){ $('reached').textContent = '読み込み失敗: '+err; }
  });

  // 時刻・曜日・到達・乗換
  $('time').addEventListener('input', e=>{ const m=+e.target.value; $('val').textContent=hhmm(m); M._rm_time(m*60); draw(); });
  $('hz').addEventListener('input', e=>{ $('hzv').textContent=e.target.value; M._rm_horizon(+e.target.value*60); draw(); });
  $('mx').addEventListener('input', e=>{ $('mxv').textContent=e.target.value; M._rm_minxfer(+e.target.value*60); draw(); });
  function setCal(h){ $('wd').classList.toggle('on',!h); $('hd').classList.toggle('on',h); M._rm_cal(h?1:0); draw(); }
  $('wd').onclick=()=>setCal(false); $('hd').onclick=()=>setCal(true);

  // 地図操作：ドラッグで移動、小さい動きはクリック＝出発地
  const wrap = $('wrap'), tip = $('tip');
  let down=false, moved=false, px=0, py=0;
  wrap.addEventListener('pointerdown', e=>{ down=true; moved=false; px=e.clientX; py=e.clientY; wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e=>{
    if (down){ const dx=e.clientX-px, dy=e.clientY-py; if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
      M._rm_pan(dx*dpr, dy*dpr); px=e.clientX; py=e.clientY; draw(); tip.style.display='none'; return; }
    const name = M.UTF8ToString(M._rm_at(e.clientX*dpr, e.clientY*dpr));
    if (name){ tip.textContent=name; tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px'; }
    else tip.style.display='none';
  });
  wrap.addEventListener('pointerup', e=>{
    down=false;
    if (!moved){ if (M._rm_pick(e.clientX*dpr, e.clientY*dpr)){ draw(); } }
  });
  wrap.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.15:1/1.15; M._rm_zoom(f, e.clientX*dpr, e.clientY*dpr); draw(); }, {passive:false});
})().catch(err=>{ const m=$('msg'); if(m) m.textContent='読み込みに失敗: '+err; });
</script>
</body>
</html>
